<title>Strong-DAD</title>
<style>
  :root{
    --bg:#0f1115; --panel:#191c22; --panel2:#20242c; --line:#30353f; --lineHi:#454c59;
    --text:#f2f4f7; --muted:#aab2bf; --faint:#6b7382; --accent:#ff6a2b; --accent2:#2bb3ff;
    --good:#44d07b; --warn:#ff9f45; --bad:#ff5a5a;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden;width:100%;}
  #app{max-width:860px;margin:0 auto;min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));}
  .topbar.col{flex-direction:column;align-items:stretch;}
  .barrow{display:flex;align-items:center;gap:10px;}
  .topbar .back{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:8px 12px;font-size:15px;cursor:pointer;line-height:1;}
  .topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  .topbar h1 .dad{color:var(--accent);}
  .wrap{padding:14px;}
  /* ---- Menü ---- */
  .hero{padding:26px 14px 8px;}
  .hero .logo{font-size:30px;font-weight:800;letter-spacing:.5px;}
  .hero .logo .dad{color:var(--accent);}
  .hero .sub{color:var(--muted);font-size:13.5px;margin-top:4px;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px;
    cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;justify-content:flex-end;
    transition:border-color .15s,background .15s;}
  .tile:active{background:var(--panel2);}
  .tile .ic{font-size:26px;line-height:1;}
  .tile .tt{font-size:16px;font-weight:650;}
  .tile .td{font-size:12px;color:var(--muted);line-height:1.35;}
  .tile.full{grid-column:1/3;flex-direction:row;align-items:center;gap:14px;min-height:0;}
  .tile.full .ic{font-size:22px;}
  /* ---- Segmented day picker ---- */
  .seg{display:flex;gap:6px;margin-bottom:14px;}
  .seg button{flex:1;cursor:pointer;padding:10px 0;font-size:14px;border-radius:10px;font-weight:600;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--sans);}
  .seg button.on{border-color:var(--accent);background:rgba(255,106,43,.16);color:var(--text);}
  .sub{color:var(--muted);font-size:13px;margin:2px 2px 14px;}
  /* ---- Cards ---- */
  .card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);margin-bottom:12px;}
  .exrow{display:flex;gap:11px;padding:12px 13px;align-items:flex-start;}
  .exrow+.exrow{border-top:1px solid var(--line);}
  .exrow .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.3;}
  .exrow .meta{color:var(--muted);font-size:12.5px;font-family:var(--mono);margin-top:3px;}
  .exrow .cue{color:var(--faint);font-size:11.5px;margin-top:3px;line-height:1.4;}
  .exrow .mid{flex:1;min-width:0;}
  .kg{font-family:var(--mono);font-size:15px;font-weight:700;white-space:nowrap;}
  .kg .u{color:var(--faint);font-size:12px;margin-left:2px;font-weight:400;}
  .badge{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap;}
  .b-welle{color:var(--good);border:1px solid rgba(68,208,123,.5);}
  .b-fin{color:var(--warn);border:1px solid rgba(255,159,69,.5);}
  .b-soll{color:var(--accent2);border:1px solid rgba(43,179,255,.5);font-family:var(--mono);}
  /* ---- Welle info ---- */
  .wellebox{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px;margin-bottom:12px;}
  .wellebox .t{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;}
  .wellerow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px;}
  .wellerow:first-of-type{border-top:none;}
  .cyclebar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
  .cyclebar button{flex:1;min-width:52px;cursor:pointer;padding:8px 2px;font-size:12px;border-radius:9px;font-weight:600;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);}
  .cyclebar button.on{border-color:var(--good);background:rgba(68,208,123,.16);color:var(--text);}
  /* ---- Inputs ---- */
  .setgrid{margin-top:9px;display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:7px;align-items:center;}
  .setgrid .hd{color:var(--faint);font-size:10.5px;font-family:var(--mono);}
  .setgrid .idx{color:var(--faint);font-family:var(--mono);font-size:13px;text-align:center;}
  .cell{background:var(--bg);border:1px solid var(--lineHi);border-radius:8px;color:var(--text);
    padding:9px 8px;font-size:15px;width:100%;font-family:var(--mono);text-align:center;}
  .cell:focus{outline:none;border-color:var(--accent);}
  .pausebtn{background:var(--panel2);border:1px solid var(--lineHi);border-radius:8px;color:var(--accent2);
    font-size:16px;cursor:pointer;padding:0;height:36px;}
  .btn{display:block;width:100%;margin-top:10px;padding:14px 0;cursor:pointer;background:var(--accent);
    color:#140a04;border:none;border-radius:11px;font-size:16px;font-weight:700;font-family:var(--sans);}
  .btn.sec{background:transparent;color:var(--text);border:1px solid var(--lineHi);}
  .btn.sm{padding:10px 0;font-size:14px;margin-top:8px;}
  .hint{color:var(--faint);font-size:12px;margin:8px 2px;line-height:1.5;}
  .fill{margin-left:6px;background:transparent;color:var(--accent2);border:none;font-size:11px;cursor:pointer;text-decoration:underline;}
  .last{color:var(--faint);font-size:11px;font-family:var(--mono);margin-top:6px;}
  .last b{color:var(--muted);}
  label{font-size:13px;color:var(--muted);}
  input[type=date]{background:var(--bg);border:1px solid var(--lineHi);border-radius:8px;color:var(--text);
    padding:8px 10px;font-size:14px;font-family:var(--mono);}
  select{background:var(--bg);border:1px solid var(--lineHi);border-radius:9px;color:var(--text);
    padding:10px 12px;font-size:15px;width:100%;font-family:var(--sans);}
  textarea{width:100%;height:160px;background:var(--bg);border:1px solid var(--lineHi);border-radius:9px;
    color:var(--text);font-family:var(--mono);font-size:12px;padding:10px;resize:vertical;}
  /* ---- Timer ---- */
  .timer{background:var(--panel2);border:1px solid var(--lineHi);border-radius:10px;
    padding:7px 9px;flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .timer.run{border-color:var(--accent);}
  .timer.done{border-color:var(--good);background:rgba(68,208,123,.12);}
  .tdisp{font-family:var(--mono);font-size:22px;font-weight:700;min-width:62px;letter-spacing:.5px;}
  .tbtn{background:var(--bg);border:1px solid var(--lineHi);border-radius:9px;color:var(--text);
    padding:8px 11px;font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:600;white-space:nowrap;}
  .tbtn.go{border-color:var(--accent);color:var(--accent);}
  .tadj{background:var(--bg);border:1px solid var(--lineHi);border-radius:9px;color:var(--text);
    width:32px;height:32px;font-size:16px;cursor:pointer;flex:none;}
  .tset{font-family:var(--mono);font-size:14px;color:var(--muted);}
  /* ---- Warmup / Conditioning ---- */
  .wu{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);margin-bottom:12px;}
  .wu .im{width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff;display:block;border-bottom:1px solid var(--line);}
  .wu .bd{padding:11px 13px;}
  .wu .st{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px;}
  .wu .nm{font-size:15.5px;font-weight:650;}
  .wu .dose{color:var(--muted);font-size:13px;font-family:var(--mono);margin-top:2px;}
  .wu .cue{color:var(--faint);font-size:12px;margin-top:4px;line-height:1.4;}
  .note{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .note .t{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .note li{font-size:12.5px;margin:4px 0;color:var(--muted);}
  .grp h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent2);margin:0 0 6px 2px;}
  .warnrow{color:var(--warn);font-size:12px;font-weight:600;margin-top:5px;}
  .metricseg{display:flex;gap:5px;margin:10px 0;}
  .metricseg button{flex:1;padding:9px 0;font-size:13px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;font-weight:600;}
  .metricseg button.on{border-color:var(--accent2);background:rgba(43,179,255,.14);color:var(--text);}
  .stat{display:flex;gap:16px;margin:4px 2px 12px;}
  .stat .v{font-family:var(--mono);font-size:20px;font-weight:700;}
  .stat .l{font-size:11px;color:var(--faint);}
  .exmenu{background:transparent;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 2px;align-self:flex-start;}
  .b-up{background:rgba(255,106,43,.18);color:var(--accent);border:1px solid rgba(255,106,43,.55);cursor:pointer;font-family:var(--sans);}
  .b-skip{color:var(--faint);border:1px solid var(--faint);}
  .card.skipped{opacity:.55;}
  .noteinp{width:100%;margin-top:7px;background:var(--bg);border:1px solid var(--lineHi);border-radius:7px;color:var(--text);padding:8px 9px;font-size:13px;font-family:var(--sans);}
  .sheetov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:var(--panel);border:1px solid var(--lineHi);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:10px 10px 18px;}
  .sheetbtn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:14px;font-size:15px;margin:6px 0;cursor:pointer;font-family:var(--sans);}
  .sheetbtn.cancel{color:var(--muted);text-align:center;}
  .backta{width:100%;min-height:92px;background:var(--bg);border:1px solid var(--lineHi);border-radius:9px;color:var(--text);padding:9px;font-family:var(--mono);font-size:11px;line-height:1.35;resize:vertical;box-sizing:border-box;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--good);color:#06160c;
    padding:11px 18px;border-radius:22px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:60;}
  .toast.on{opacity:1;}
</style>
</head>

  <div id="root"></div>
</div>

  function tone(f,t0,d){var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(.5,c.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+d);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d);}
  tone(880,0,.25);tone(1175,.28,.35);}catch(e){}}

/* Progressionsreihe für eine Übung (SEED + geloggt) */
function seriesFor(key){
  var pts=[];
  var seed=SEED[key]||[];
  seed.forEach(function(e){var d=e[0],sets=e[1];var valid=sets.filter(s=>s[0]>0&&s[1]>0);if(!valid.length)return;
    var top=valid.reduce((a,b)=>(b[0]>a[0]||(b[0]===a[0]&&b[1]>a[1]))?b:a,valid[0]);
    var vol=valid.reduce((s,x)=>s+x[0]*x[1],0);pts.push({date:d,w:top[0],r:top[1],vol:vol});});
  sessions.forEach(function(s){ (s.entries||[]).forEach(function(en){ if(en.exercise!==key)return;
    var valid=en.sets.filter(x=>x.w>0&&x.r>0);if(!valid.length)return;
    var top=valid.reduce((a,b)=>(b.w>a.w||(b.w===a.w&&b.r>a.r))?b:a,valid[0]);
    var vol=valid.reduce((a,x)=>a+x.w*x.r,0);pts.push({date:s.date,w:top.w,r:top.r,vol:vol});});});
  pts.sort((a,b)=>a.date.localeCompare(b.date));
  return pts;
}
function allExercises(){
  var set={};Object.keys(SEED).forEach(k=>set[k]=1);
  sessions.forEach(s=>(s.entries||[]).forEach(e=>set[e.exercise]=1));
  return Object.keys(set).sort();
}

/* ============ TIMER (shared) ============ */
var Timer={remain:0,total:0,running:false,iv:null,elDisp:null,elBox:null};
function timerSet(min,sec){Timer.total=min*60+sec;Timer.remain=Timer.total;Timer.running=false;if(Timer.iv){clearInterval(Timer.iv);Timer.iv=null;}timerPaint();}
function timerPaint(){ if(!Timer.elDisp)return;
  var m=Math.floor(Timer.remain/60),s=Timer.remain%60;Timer.elDisp.textContent=m+":"+(s<10?"0":"")+s;
  Timer.elBox.classList.toggle("run",Timer.running);
  Timer.elBox.classList.toggle("done",!Timer.running&&Timer.remain===0&&Timer.total>0);
}
function timerStart(){ if(Timer.running)return; if(Timer.remain<=0)Timer.remain=Timer.total; if(Timer.remain<=0)return;
  Timer.running=true;timerPaint();
  Timer.iv=setInterval(function(){Timer.remain--;if(Timer.remain<=0){Timer.remain=0;Timer.running=false;clearInterval(Timer.iv);Timer.iv=null;beep();vibe();timerPaint();toast("⏱ Pause vorbei");}else timerPaint();},1000);
}
function timerStop(){Timer.running=false;if(Timer.iv){clearInterval(Timer.iv);Timer.iv=null;}timerPaint();}
function timerReset(){timerStop();Timer.remain=Timer.total;timerPaint();}
function startPauseFromDefault(){timerSet(timerDefault.min,timerDefault.sec);timerStart();toast("Pause läuft");}

var grid={}; var gmeta={}; var gridKey="";
function ensureGrid(day,date){
  var k=day+"|"+date; if(gridKey===k) return; gridKey=k; grid={}; gmeta={};
  var step=CYCLE_STEPS[cycleIdx];
  var existing=sessions.find(s=>s.date===date&&s.day===day);
  PLAN[day].ex.forEach(function(e){
    var calc=e.welle?liftForWeek(e.base,step):null;
    var soll=calc?calc.w:(e.w||0);
    var n=calc?calc.sets:e.sets;
    var prev=existing&&existing.entries.find(en=>en.exercise===e.key);
    var rows=[];
    for(var i=0;i<n;i++){ var pr=prev&&prev.sets[i];
      rows.push({ w:(pr&&pr.w)?String(pr.w):(soll>0?String(soll):""), r:(pr&&pr.r)?String(pr.r):"" }); }
    grid[e.key]=rows;
    gmeta[e.key]={note:(prev&&prev.note!=null)?prev.note:null, skip:(prev&&prev.skipped)||false};
  });
}

  var day=(ownState.name||"").trim()||"Eigenes Workout";
  var lines=["Workout "+day+"   "+fmtDM(ownState.date),""];
  entries.forEach(function(en){lines.push(en.name);en.sets.forEach(function(s,i){if(s.w||s.r)lines.push("Set "+(i+1)+": "+(s.w||"")+" kg × "+(s.r||""));});lines.push("");});
  var txt=lines.join("\n").trim();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast("Kopiert ✓"),()=>exportFallback(txt));
  else exportFallback(txt);
}

/* ---- Strong-Import ---- */
function parseStrong(text){
  var lines=text.split(/\r?\n/).map(l=>l.trim());
  var entries=[],cur=null,unmatched=[],date=todayISO(),day=null;
  var setRe=/(?:set|satz)?\s*\d*\s*:?\s*([\d.,]+)\s*kg\s*[×x\*]\s*(\d+)/i;
  var dayRe=/(dienstag|donnerstag|sonntag)/i;
  function flush(){ if(cur&&cur.mapped&&cur.sets.length)entries.push({exercise:cur.mapped,name:cur.mapped,sets:cur.sets}); else if(cur&&cur.sets.length)unmatched.push(cur.rawName); cur=null; }
  lines.forEach(function(raw){ if(!raw)return; var low=raw.toLowerCase();
    var dm=raw.match(dayRe); if(dm){var t=dm[1].toLowerCase();day=t[0]==="d"&&t[1]==="i"?"Di":t.indexOf("donners")===0?"Do":"So";}
    if(/^(cycling|workout|notizen|training|https?:|w1:)/i.test(low)){ if(/^cycling/i.test(low))flush(); return; }
    var sm=raw.match(setRe);
    if(sm){var w=parseFloat(sm[1].replace(",","."));var r=parseInt(sm[2],10);if(cur&&w>0&&r>0)cur.sets.push({w:w,r:r});return;}
    if(/[a-zäöü]/i.test(raw)){ flush(); if(/^notizen/i.test(low)){cur=null;return;} var key=low.replace(/\s+/g," ").trim(); cur={rawName:raw,mapped:NAME_MAP[key]||null,sets:[]}; }
  });
  flush();
  return {entries:entries,unmatched:unmatched,day:day,date:date};
}
function viewImport(){
  var f=document.createDocumentFragment();
  f.appendChild(el("div","sub","Strong-Export hier einfügen und analysieren. Erkannte Übungen fließen in die Kurven."));
  var ta=el("textarea");ta.placeholder="Training Dienstag\n…\nBench Press (Barbell)\nSet 1: 80 kg × 8\n…";f.appendChild(ta);
  var out=el("div");out.style.marginTop="10px";
  var b=el("button","btn","Analysieren");
  b.onclick=function(){var res=parseStrong(ta.value); out.innerHTML="";
    if(!res.entries.length){out.appendChild(el("div","hint","Keine Übungen erkannt."));return;}
    var card=el("div","card");
    res.entries.forEach(function(en){var row=el("div","exrow");var mid=el("div","mid");
      mid.appendChild(el("div","nm",en.name));
      mid.appendChild(el("div","meta",en.sets.map(s=>s.w+"×"+s.r).join(" · ")));row.appendChild(mid);card.appendChild(row);});
    out.appendChild(card);
    if(res.unmatched.length)out.appendChild(el("div","hint","Nicht zugeordnet: "+res.unmatched.join(", ")));
    var imp=el("button","btn","Import speichern ("+(res.day?PLAN[res.day]?PLAN[res.day].label:res.day:"Import")+")");
    imp.onclick=function(){var day=res.day||"Import";var sess={id:Date.now(),date:res.date,day:day,entries:res.entries};
      sessions=sessions.filter(s=>!(s.date===sess.date&&s.day===day)).concat([sess]).sort((a,b)=>a.date.localeCompare(b.date));lset(K_SESS,sessions);toast("Importiert ✓");};
    out.appendChild(imp);
  };
  f.appendChild(b);f.appendChild(out);
  return f;
}
